<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barrel Hop</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;background:#f1f3de;color:#173f34;font:1rem/1.4 system-ui}header,footer{display:flex;align-items:center;justify-content:space-between;gap:.65rem;padding:.6rem 1rem}header{background:#173f34;color:#fff}button{font:inherit;font-weight:bold;border:0;border-radius:2em;background:#173f34;color:white;padding:.55em 1.2em;cursor:pointer}canvas{width:100%;flex:1;min-height:0;touch-action:manipulation;cursor:pointer}button:focus-visible,canvas:focus-visible{outline:3px solid #e18629;outline-offset:-3px}
</style>
<header><strong>Garden dash</strong><span id="score">Barrels cleared · 0</span></header>
<canvas tabindex="0" aria-label="Garden course. Press Space or tap to jump."></canvas>
<footer><span id="message" role="status">Press Space or tap to jump.</span><button>Play</button></footer>
<script>
const canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
const button=document.querySelector('button'), message=document.querySelector('#message'), score=document.querySelector('#score');
let mode='ready', width, height, x, lift=0, velocity=0, cleared=0, distance=0, last=0;
function resize(){
  const rect=canvas.getBoundingClientRect(), ratio=devicePixelRatio||1;
  canvas.width=Math.round(rect.width*ratio); canvas.height=Math.round(rect.height*ratio);
  height=200; const previous=width; width=height*rect.width/rect.height;
  if(previous) x*=width/previous; else x=width*.78;
  ctx.setTransform(canvas.width/width,0,0,canvas.height/height,0,0); draw();
}
function box(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function draw(){
  box(0,0,width,200,'#d9ebdb');
  ctx.fillStyle='#fff1aa';ctx.beginPath();ctx.arc(width*.8,37,20,0,7);ctx.fill();
  for(let i=-80-(distance*.14)%80;i<width+80;i+=80){
    ctx.fillStyle='#9bbda2';ctx.beginPath();ctx.arc(i,143,54,Math.PI,2*Math.PI);ctx.fill();
  }
  for(let i=-(distance*.4)%34;i<width;i+=34)box(i,130,8,34,'#c1cd98');
  box(0,142,width,5,'#c1cd98');box(0,164,width,6,'#67834d');box(0,170,width,30,'#d3b17e');
  ctx.save();ctx.translate(44,164-lift);
  const fur='#d97639', stripe='#86452b', step=mode==='run'&&!lift?Math.sin(distance*.14)*3:0;
  box(-9,-26,7,15,fur);box(-13,-32,6,9,fur);box(-15,-34,7,5,stripe);
  box(-4,-21,32,15,fur);box(0,-8,6,8+step,fur);box(20,-8,6,8-step,fur);
  box(17,-32,21,18,fur);box(17,-37,5,7,fur);box(31,-37,5,7,fur);
  box(32,-27,3,3,'#263731');box(35,-21,6,4,'#f6dbac');box(3,-21,4,7,stripe);box(11,-21,4,6,stripe);ctx.restore();
  box(x+2,132,24,32,'#88542e');box(x,137,28,22,'#b97e44');
  box(x+7,134,2,28,'#d79f5e');box(x+18,134,2,28,'#926035');
  box(x,137,28,4,'#4e5749');box(x,155,28,4,'#4e5749');
}
function jump(){
  if(mode!=='run'){
    mode='run';cleared=0;lift=0;x=Math.max(190,width*.78);last=0;
    score.textContent='Barrels cleared · 0';message.textContent='Space or tap to jump.';button.textContent='Jump';requestAnimationFrame(frame);
  }
  if(lift===0)velocity=440;
}
function frame(now){
  const dt=last?Math.min(.025,(now-last)/1000):0;last=now;
  const speed=Math.min(395,235+cleared*9);
  velocity-=1120*dt; lift=Math.max(0,lift+velocity*dt);if(lift===0&&velocity<0)velocity=0;
  x-=speed*dt;distance+=speed*dt;
  if(x<78&&x+26>44&&lift<29){
    mode='over';button.textContent='Replay';message.textContent='Barrel bumped! Press Space to retry.';
  }else if(x+28<44){
    cleared++;score.textContent='Barrels cleared · '+cleared;x=Math.max(width,300)+Math.random()*90;
  }
  draw();if(mode==='run')requestAnimationFrame(frame);
}
window.addEventListener('keydown',event=>{
  if(event.code==='Space'){event.preventDefault();if(!event.repeat)jump()}
});
canvas.addEventListener('pointerdown',()=>{canvas.focus();jump()});button.addEventListener('click',jump);
new ResizeObserver(resize).observe(canvas);
</script></html>
