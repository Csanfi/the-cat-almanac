<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barrel Hop</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;background:#f1f3de;color:#173f34;font:1rem/1.4 system-ui}header,footer{display:flex;align-items:center;justify-content:space-between;gap:.65rem;padding:.6rem 1rem}header{background:#173f34;color:#fff}button{font:inherit;font-weight:bold;border:0;border-radius:2em;background:#173f34;color:white;padding:.55em 1.2em;cursor:pointer}canvas{width:100%;flex:1;min-height:0;touch-action:manipulation;cursor:pointer}button:focus-visible,canvas:focus-visible{outline:3px solid #e18629;outline-offset:-3px}
footer{flex-wrap:wrap}footer span{flex:1 1 10rem}.controls{display:flex;gap:.4rem}#beam{background:#145c77}#beam:disabled{opacity:.6}
</style>
<header><strong id="level">Level 1 · Prairie</strong><span id="score">Hay bale · 0/1</span></header>
<canvas tabindex="0" aria-label="Garden course. Press Space or tap to jump."></canvas>
<canvas id="concert" hidden aria-label="Victory concert. WALL-E plays electric guitar under moving spotlights as the crowd cheers."></canvas>
<footer><span id="message" role="status">Press Space to jump. K fires a beam.</span><div class="controls"><button>Play</button><button id="beam" disabled>Kamehameha</button><button id="music" hidden>Play music</button></div></footer>
<script src="vendor/three.min.js"></script>
<script src="encore.js?v=robot"></script>
<script src="garden-3d.js?v=robot"></script>
<script>
let canvas=document.querySelector('canvas'), garden, ctx;
try {
  garden=createGarden(canvas);
} catch {
  const fallback=canvas.cloneNode(false);
  canvas.replaceWith(fallback);canvas=fallback;
  ctx=canvas.getContext('2d');
}
const robotSprite=new Image();robotSprite.onload=()=>{if(width)draw()};robotSprite.src="robot.png";
const button=document.querySelector('button'), message=document.querySelector('#message'), score=document.querySelector('#score');
let mode='ready', width, height, x, lift=0, velocity=0, cleared=0, distance=0, last=0;
const stages=[
  {name:'Prairie',items:'Hay bale',speed:310,sky:'#448fc4',land:'#bfa054'},
  {name:'Forest',items:'Stump',speed:335,sky:'#548e83',land:'#567547'},
  {name:'Cold',items:'Ice spike',speed:360,sky:'#5086b5',land:'#afcddc'},
  {name:'Fire',items:'Lava rock',speed:390,sky:'#ad5043',land:'#594345'}
];
const perLevel=1;
const encore=createEncore(document.querySelector('#concert'),document.querySelector('#music'));
let level=0, frameId;
function updateHUD(){
  const stage=stages[level];
  document.querySelector('#level').textContent='Level '+(level+1)+' · '+stage.name;
  score.textContent=stage.items+' · '+(cleared-level*perLevel)+'/'+perLevel;
}
const beam=document.querySelector('#beam');
let beamTime=0, cooldown=0, beamY=0;
const shout = new Audio('kamehameha.mp3');
shout.preload = 'auto';
function fire(){
  if(mode!=='run'||cooldown>0)return;
  shout.currentTime = 0;
  shout.play().catch(() => {});
  message.textContent = 'Kamehameha!';
  beamY=149-lift;
  beamTime=.3; cooldown=2;
  beam.disabled=true; beam.textContent='Charging…';
  if(x+28>=80 && x<=width && beamY+6>=132)clearObstacle();
  draw();
}
function clearObstacle(){
  cleared++;
  level=Math.min(3,Math.floor(cleared/perLevel));
  updateHUD();
  if(cleared===perLevel*stages.length){
    cancelAnimationFrame(frameId);mode='won';beam.disabled=true;button.textContent='Replay';
    document.querySelector('#level').textContent='Victory concert';
    score.textContent=cleared+'/'+(perLevel*stages.length)+' cleared';
    message.textContent='All four terrains cleared!';canvas.hidden=true;beam.hidden=true;encore.start();
    x=width+100;return;
  }
  if(cleared%perLevel===0)message.textContent='Entering '+stages[level].name+'!';
  x=Math.max(width,300)+Math.random()*90;
}
function resize(){
  const rect=canvas.getBoundingClientRect(), ratio=devicePixelRatio||1;
  if(!rect.width || !rect.height)return;
  height=200; const previous=width; width=height*rect.width/rect.height;
  if(previous) x*=width/previous; else x=width*.78;
  if(garden){garden.resize(rect.width,rect.height,width);draw();return}
  canvas.width=Math.round(rect.width*ratio); canvas.height=Math.round(rect.height*ratio);
  ctx.setTransform(canvas.width/width,0,0,canvas.height/height,0,0); draw();
}
function box(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function draw(){
  if(garden){garden.draw({x,lift,distance,mode,width,beamTime,beamY,level,stage:stages[level]});return}
  box(0,0,width,200,stages[level].sky);
  ctx.fillStyle='#fff1aa';ctx.beginPath();ctx.arc(width*.8,37,20,0,7);ctx.fill();
  for(let i=-80-(distance*.14)%80;i<width+80;i+=80){
    ctx.fillStyle='#9bbda2';ctx.beginPath();ctx.arc(i,143,54,Math.PI,2*Math.PI);ctx.fill();
  }
  for(let i=-(distance*.4)%34;i<width;i+=34)box(i,130,8,34,'#c1cd98');
  box(0,142,width,5,'#c1cd98');box(0,164,width,6,'#67834d');box(0,170,width,30,stages[level].land);
  if(robotSprite.naturalWidth)ctx.drawImage(robotSprite,30,110-lift,60,60);
  if(level<2){
    const hay=level===0;
    box(x,132,28,32,hay?'#d6a247':'#815337');
    box(x+4,134,3,30,hay?'#946d36':'#563e32');
    box(x+21,134,3,30,hay?'#946d36':'#563e32');
    box(x,132,28,4,hay?'#edbe62':'#c59869');
  }else{
    ctx.fillStyle=level===2?'#64bedc':'#733b32';
    ctx.beginPath();ctx.moveTo(x,164);ctx.lineTo(x+10,132);ctx.lineTo(x+19,142);ctx.lineTo(x+28,164);ctx.fill();
    box(x+12,145,4,14,level===2?'#c7f6ff':'#ff9542');
  }
  if(beamTime>0){
    ctx.save();ctx.globalAlpha=Math.min(1,beamTime*8);
    box(80,beamY-6,width-80,12,'#30bde0');
    box(80,beamY-2,width-80,4,'#edffff');
    ctx.fillStyle='#aff7ff';ctx.beginPath();ctx.arc(80,beamY,8,0,2*Math.PI);ctx.fill();ctx.restore();
  }
}
function jump(){
  if(mode!=='run'){
    encore.stop();canvas.hidden=false;beam.hidden=false;encore.unlock();
    mode='run';cleared=0;lift=0;x=Math.max(190,width*.78);last=0;
    cooldown=0;beamTime=0;beam.disabled=false;beam.textContent='Kamehameha';
    level=0;updateHUD();message.textContent='Space jumps. K fires a beam.';button.textContent='Jump';frameId=requestAnimationFrame(frame);
  }
  if(lift===0)velocity=440;
}
function frame(now){
  if(mode!=='run')return;
  const dt=last?Math.min(.025,(now-last)/1000):0;last=now;
  beamTime=Math.max(0,beamTime-dt);
  cooldown=Math.max(0,cooldown-dt);
  if(cooldown===0 && beam.disabled){beam.disabled=false;beam.textContent='Kamehameha';message.textContent='Space jumps. K fires a beam.'}
  const speed=stages[level].speed;
  velocity-=1120*dt; lift=Math.max(0,lift+velocity*dt);if(lift===0&&velocity<0)velocity=0;
  x-=speed*dt;distance+=speed*dt;
  if(x<78&&x+26>44&&lift<29){
    mode='over';beam.disabled=true;beam.textContent='Kamehameha';button.textContent='Replay';message.textContent='Obstacle hit! Press Space to retry.';
  }else if(x+28<44){
    clearObstacle();
  }
  draw();if(mode==='run')frameId=requestAnimationFrame(frame);
}
window.addEventListener('keydown',event=>{
  if(event.code==='KeyK'&&!event.repeat)fire();
  if(event.code==='Space' && event.target!==beam && event.target.id!=='music'){event.preventDefault();if(!event.repeat)jump()}
});
canvas.addEventListener('pointerdown',()=>{canvas.focus();jump()});button.addEventListener('click',jump);
beam.addEventListener('click',fire);
new ResizeObserver(resize).observe(canvas);
</script></html>
